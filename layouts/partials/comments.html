<div id="giscus-container"></div>
<script>
(function() {
    var theme = document.body.classList.contains('dark') ? 'dark_dimmed' : 'light';
    var s = document.createElement('script');
    s.src = 'https://giscus.app/client.js';
    s.setAttribute('data-repo', 'overkazaf/blogs');
    s.setAttribute('data-repo-id', 'R_kgDOSPmtvQ');
    s.setAttribute('data-category', 'General');
    s.setAttribute('data-category-id', 'DIC_kwDOSPmtvc4C8XVv');
    s.setAttribute('data-mapping', 'pathname');
    s.setAttribute('data-strict', '0');
    s.setAttribute('data-reactions-enabled', '1');
    s.setAttribute('data-emit-metadata', '0');
    s.setAttribute('data-input-position', 'top');
    s.setAttribute('data-theme', theme);
    s.setAttribute('data-lang', 'zh-CN');
    s.setAttribute('data-loading', 'lazy');
    s.crossOrigin = 'anonymous';
    s.async = true;
    document.getElementById('giscus-container').appendChild(s);
})();

// Sync Giscus theme when user toggles dark/light
document.getElementById('theme-toggle')?.addEventListener('click', function() {
    setTimeout(function() {
        var isDark = document.body.classList.contains('dark');
        var iframe = document.querySelector('iframe.giscus-frame');
        if (iframe) {
            iframe.contentWindow.postMessage(
                { giscus: { setConfig: { theme: isDark ? 'dark_dimmed' : 'light' } } },
                'https://giscus.app'
            );
        }
    }, 100);
});
</script>
