<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 900" width="1200" height="900"
     font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A"/>
      <stop offset="100%" style="stop-color:#1E293B"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feOffset dx="0" dy="3" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow-down" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#A78BFA"/></marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FB7185"/></marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34D399"/></marker>
  </defs>
  <style>
    .title-main   { font-size: 24px; fill: #F1F5F9; text-anchor: middle; dominant-baseline: central; font-weight: 700; }
    .title-accent { fill: #38BDF8; }
    .subtitle     { font-size: 14px; fill: #CBD5E1; text-anchor: middle; dominant-baseline: central; }
    .card-title   { font-size: 20px; fill: #F8FAFC; font-weight: 700; dominant-baseline: central; }
    .card-sub     { font-size: 13px; fill: #CBD5E1; dominant-baseline: central; }
    .section-label{ font-size: 12px; fill: #94A3B8; font-weight: 600; letter-spacing: 0.5px; dominant-baseline: central; }
    .body-text    { font-size: 13px; fill: #E2E8F0; dominant-baseline: central; }
    .item-text    { font-family: 'SF Mono','Menlo',monospace; font-size: 12px; fill: #E2E8F0; dominant-baseline: central; }
    .pill-txt     { font-size: 12px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
    .dim-num      { font-family: 'SF Mono','Menlo',monospace; font-size: 14px; font-weight: 700; fill: #0F172A; text-anchor: middle; dominant-baseline: central; }
    .footer-text  { font-size: 13px; fill: #CBD5E1; dominant-baseline: central; }
      .code         { font-family: 'SF Mono','Menlo',monospace; font-size: 13px; fill: #E2E8F0; dominant-baseline: central; }
    .code-keyword { fill: #F472B6; }
    .code-type    { fill: #A5F3FC; }
    .code-number  { fill: #FDBA74; }
    .code-out     { fill: #86EFAC; }
  </style>
  <rect width="1200" height="900" fill="url(#canvasBg)"/>

  <text x="600" y="42" class="title-main">llm_challenge.so <tspan class="title-accent">·</tspan> 三级验证链</text>
  <text x="600" y="72" class="subtitle">每一级用一种不同的混淆保护，过一级拿一个 FLAG；任何一级不通过就 return 0</text>

  <!-- arrows between rows, drawn first -->
  <line x1="600" y1="230" x2="600" y2="284" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-down)"/>
  <line x1="600" y1="410" x2="600" y2="454" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-down)"/>
  <line x1="600" y1="580" x2="600" y2="624" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-down)"/>
  <line x1="600" y1="750" x2="600" y2="794" stroke="#34D399" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <rect x="612" y="421" width="54" height="22" rx="11" fill="#0F172A" stroke="#94A3B8" stroke-width="0.8"/>
  <text x="639" y="432" class="pill-txt" fill="#CBD5E1">通过</text>
  <rect x="612" y="591" width="54" height="22" rx="11" fill="#0F172A" stroke="#94A3B8" stroke-width="0.8"/>
  <text x="639" y="602" class="pill-txt" fill="#CBD5E1">通过</text>
  <rect x="612" y="761" width="54" height="22" rx="11" fill="#0F172A" stroke="#34D399" stroke-width="0.8"/>
  <text x="639" y="772" class="pill-txt" fill="#6EE7B7">通过</text>

  <!-- root: verify_key -->
  <g transform="translate(160, 100)">
    <rect x="0" y="0" width="880" height="130" rx="10" fill="#0F1E2E" stroke="#38BDF8" stroke-width="1.5" filter="url(#softShadow)"/>
    <rect x="0" y="0" width="4" height="130" rx="2" fill="#38BDF8"/>
    <text x="24" y="30" class="code" style="font-size:16px"><tspan class="code-keyword">int</tspan> verify_key(<tspan class="code-keyword">const char</tspan>* input)</text>
    <text x="856" y="30" class="card-sub" style="text-anchor:end">输入必须正好 16 字节，按 4 字节切成 4 段</text>
    <rect x="24" y="62" width="196" height="48" rx="6" fill="#020617" stroke="#1E3A5F" stroke-width="1"/>
    <text x="38" y="79" class="item-text" fill="#A5F3FC">part1</text>
    <text x="38" y="98" class="card-sub" style="font-size:12px">input[0..3] · uint32</text>
    <rect x="236" y="62" width="196" height="48" rx="6" fill="#020617" stroke="#1E3A5F" stroke-width="1"/>
    <text x="250" y="79" class="item-text" fill="#A5F3FC">part2</text>
    <text x="250" y="98" class="card-sub" style="font-size:12px">input[4..7] · uint32</text>
    <rect x="448" y="62" width="196" height="48" rx="6" fill="#020617" stroke="#334155" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="630" y="79" class="card-sub" style="text-anchor:end;font-size:12px;fill:#94A3B8">未参与校验</text>
    <text x="462" y="79" class="item-text" fill="#94A3B8">part3</text>
    <text x="462" y="98" class="card-sub" style="font-size:12px">input[8..11] · uint32</text>
    <rect x="660" y="62" width="196" height="48" rx="6" fill="#020617" stroke="#334155" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="842" y="79" class="card-sub" style="text-anchor:end;font-size:12px;fill:#94A3B8">未参与校验</text>
    <text x="674" y="79" class="item-text" fill="#94A3B8">part4</text>
    <text x="674" y="98" class="card-sub" style="font-size:12px">input[12..15] · uint32</text>
  </g>

  <g transform="translate(80, 290)">
    <rect x="0" y="0" width="1040" height="120" rx="12" fill="#0F1E2E" stroke="#334155" stroke-width="1" filter="url(#softShadow)"/>
    <rect x="0" y="0" width="1040" height="5" rx="12" fill="#38BDF8"/>
    <rect x="0" y="3" width="1040" height="4" fill="#38BDF8"/>
    <circle cx="46" cy="62" r="24" fill="#38BDF8" filter="url(#softShadow)"/>
    <text x="46" y="62" class="dim-num" style="font-size:20px">1</text>
    <text x="88" y="40" class="code" style="font-size:16px">s1 = <tspan class="code-type">stage1_verify</tspan>(part1)</text>
    <text x="88" y="72" class="section-label">保护方式</text>
    <text x="160" y="72" class="body-text">CFF 控制流平坦化</text>
    <text x="88" y="98" class="section-label">四维框架</text>
    <text x="160" y="98" class="card-sub">考验跨片段的上下文整合</text>
    <line x1="640" y1="20" x2="640" y2="100" stroke="#334155" stroke-width="1"/>
    <text x="664" y="34" class="section-label">校验</text>
    <text x="664" y="60" class="code" style="font-size:15px">s1 == <tspan class="code-number">0x12345678</tspan></text>
    <rect x="664" y="80" width="76" height="26" rx="13" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
    <text x="702" y="93" class="pill-txt" fill="#38BDF8">FLAG 1</text>
    <rect x="752" y="80" width="130" height="26" rx="13" fill="#052E1A" stroke="#34D399" stroke-width="1"/>
    <text x="817" y="93" class="pill-txt" fill="#6EE7B7">LLM 应该能解</text>
    <text x="1016" y="60" class="card-sub" style="text-anchor:end;fill:#FECDD3">否则 return 0</text>
  </g>

  <g transform="translate(80, 460)">
    <rect x="0" y="0" width="1040" height="120" rx="12" fill="#2D1B3D" stroke="#334155" stroke-width="1" filter="url(#softShadow)"/>
    <rect x="0" y="0" width="1040" height="5" rx="12" fill="#A78BFA"/>
    <rect x="0" y="3" width="1040" height="4" fill="#A78BFA"/>
    <circle cx="46" cy="62" r="24" fill="#A78BFA" filter="url(#softShadow)"/>
    <text x="46" y="62" class="dim-num" style="font-size:20px">2</text>
    <text x="88" y="40" class="code" style="font-size:16px">s2 = <tspan class="code-type">stage2_verify</tspan>(part2, s1)</text>
    <text x="88" y="72" class="section-label">保护方式</text>
    <text x="160" y="72" class="body-text">BCF 假分支 + MBA 恒真谓词</text>
    <text x="88" y="98" class="section-label">四维框架</text>
    <text x="160" y="98" class="card-sub">考验推理深度与噪声过滤</text>
    <line x1="640" y1="20" x2="640" y2="100" stroke="#334155" stroke-width="1"/>
    <text x="664" y="34" class="section-label">校验</text>
    <text x="664" y="60" class="code" style="font-size:15px">s2 == <tspan class="code-number">0x9ABCDEF0</tspan></text>
    <rect x="664" y="80" width="76" height="26" rx="13" fill="#0F172A" stroke="#A78BFA" stroke-width="1"/>
    <text x="702" y="93" class="pill-txt" fill="#A78BFA">FLAG 2</text>
    <rect x="752" y="80" width="130" height="26" rx="13" fill="#713F12" stroke="#FBBF24" stroke-width="1"/>
    <text x="817" y="93" class="pill-txt" fill="#FDE68A">LLM 部分能解</text>
    <text x="1016" y="60" class="card-sub" style="text-anchor:end;fill:#FECDD3">否则 return 0</text>
  </g>

  <g transform="translate(80, 630)">
    <rect x="0" y="0" width="1040" height="120" rx="12" fill="#2E1421" stroke="#334155" stroke-width="1" filter="url(#softShadow)"/>
    <rect x="0" y="0" width="1040" height="5" rx="12" fill="#FB7185"/>
    <rect x="0" y="3" width="1040" height="4" fill="#FB7185"/>
    <circle cx="46" cy="62" r="24" fill="#FB7185" filter="url(#softShadow)"/>
    <text x="46" y="62" class="dim-num" style="font-size:20px">3</text>
    <text x="88" y="40" class="code" style="font-size:16px">s3 = <tspan class="code-type">stage3_verify</tspan>(s1, s2)</text>
    <text x="88" y="72" class="section-label">保护方式</text>
    <text x="160" y="72" class="body-text">IS + CFF + BCF 三层组合</text>
    <text x="88" y="98" class="section-label">四维框架</text>
    <text x="160" y="98" class="card-sub">四个维度同时施压</text>
    <line x1="640" y1="20" x2="640" y2="100" stroke="#334155" stroke-width="1"/>
    <text x="664" y="34" class="section-label">校验</text>
    <text x="664" y="60" class="code" style="font-size:15px">s3 == <tspan class="code-number">0xCAFEBABE</tspan></text>
    <rect x="664" y="80" width="76" height="26" rx="13" fill="#0F172A" stroke="#FB7185" stroke-width="1"/>
    <text x="702" y="93" class="pill-txt" fill="#FB7185">FLAG 3</text>
    <rect x="752" y="80" width="130" height="26" rx="13" fill="#450A0A" stroke="#FB7185" stroke-width="1"/>
    <text x="817" y="93" class="pill-txt" fill="#F87171">LLM 应该解不出</text>
    <text x="1016" y="60" class="card-sub" style="text-anchor:end;fill:#FECDD3">否则 return 0</text>
  </g>

  <g transform="translate(400, 800)">
    <rect x="0" y="0" width="400" height="60" rx="10" fill="#0F2A1F" stroke="#34D399" stroke-width="1.5" filter="url(#softShadow)"/>
    <text x="200" y="30" class="code" style="text-anchor:middle;font-size:16px"><tspan class="code-keyword">return</tspan> <tspan class="code-number">1</tspan><tspan dx="14" fill="#CBD5E1" style="font-family:'PingFang SC',sans-serif;font-size:14px">三个 FLAG 全部拿到</tspan></text>
  </g>
</svg>
