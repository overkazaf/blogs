<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 960" width="1200" height="960"
     font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A"/>
      <stop offset="100%" style="stop-color:#1E293B"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feOffset dx="0" dy="3" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker>
  </defs>
  <style>
    .title-main   { font-size: 24px; fill: #F1F5F9; text-anchor: middle; dominant-baseline: central; font-weight: 700; }
    .title-accent { fill: #38BDF8; }
    .subtitle     { font-size: 14px; fill: #CBD5E1; text-anchor: middle; dominant-baseline: central; }
    .card-title   { font-size: 20px; fill: #F8FAFC; font-weight: 700; dominant-baseline: central; }
    .card-sub     { font-size: 14px; fill: #CBD5E1; dominant-baseline: central; }
    .section-label{ font-size: 12px; fill: #94A3B8; font-weight: 600; letter-spacing: 0.5px; dominant-baseline: central; }
    .code         { font-family: 'SF Mono','Menlo',monospace; font-size: 13px; fill: #E2E8F0; dominant-baseline: central; }
    .code-comment { font-family: 'SF Mono','Menlo',monospace; font-size: 12px; fill: #64748B; font-style: italic; dominant-baseline: central; }
    .code-keyword { fill: #F472B6; }
    .code-number  { fill: #FDBA74; }
    .pill-txt     { font-size: 12px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
    .step-num     { font-family: 'SF Mono','Menlo',monospace; font-size: 20px; font-weight: 700; fill: #0F172A; text-anchor: middle; dominant-baseline: central; }
    .lvl-num      { font-family: 'SF Mono','Menlo',monospace; font-size: 16px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
    .lvl-txt      { font-size: 12px; fill: #CBD5E1; text-anchor: middle; dominant-baseline: central; }
    .footer-text  { font-size: 14px; fill: #CBD5E1; text-anchor: middle; dominant-baseline: central; }
  </style>
  <rect width="1200" height="960" fill="url(#canvasBg)"/>

  <text x="600" y="42" class="title-main">论文实验怎么做 <tspan class="title-accent">·</tspan> 同一段代码，五种混淆，八个模型</text>
  <text x="600" y="72" class="subtitle">控制变量：只改混淆方式，其余条件全部相同</text>

  <!-- Step 1 -->
  <g transform="translate(60, 104)">
    <rect x="0" y="0" width="1080" height="136" rx="12" fill="#0F1E2E" stroke="#334155" stroke-width="1" filter="url(#softShadow)"/>
    <rect x="0" y="0" width="1080" height="5" rx="12" fill="#38BDF8"/>
    <rect x="0" y="3" width="1080" height="4" fill="#38BDF8"/>
    <circle cx="48" cy="52" r="22" fill="#38BDF8"/>
    <text x="48" y="52" class="step-num">1</text>
    <text x="84" y="52" class="card-title">准备测试函数</text>
    <text x="84" y="88" class="card-sub">15 行 C 代码，按 n % 4 分成 4 个分支</text>
    <text x="84" y="112" class="card-sub">足够短，还原得对不对一眼可判</text>
    <rect x="440" y="24" width="620" height="92" rx="6" fill="#020617" stroke="#1E293B" stroke-width="1"/>
    <text x="456" y="44" class="code-comment">// 4 个分支都用到同一个魔数 0xBAAAD0BF</text>
    <text x="456" y="68" class="code"><tspan class="code-keyword">if</tspan> (mod == <tspan class="code-number">0</tspan>) result = (n | <tspan class="code-number">0xBAAAD0BF</tspan>) * (<tspan class="code-number">2</tspan> ^ n);</text>
    <text x="456" y="92" class="code"><tspan class="code-keyword">else if</tspan> (mod == <tspan class="code-number">1</tspan>) result = (n &amp; <tspan class="code-number">0xBAAAD0BF</tspan>) * (<tspan class="code-number">3</tspan> + n);</text>
  </g>
  <line x1="600" y1="240" x2="600" y2="262" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow-flow)"/>

  <!-- Step 2 -->
  <g transform="translate(60, 268)">
    <rect x="0" y="0" width="1080" height="136" rx="12" fill="#2D1B3D" stroke="#334155" stroke-width="1" filter="url(#softShadow)"/>
    <rect x="0" y="0" width="1080" height="5" rx="12" fill="#A78BFA"/>
    <rect x="0" y="3" width="1080" height="4" fill="#A78BFA"/>
    <circle cx="48" cy="52" r="22" fill="#A78BFA"/>
    <text x="48" y="52" class="step-num">2</text>
    <text x="84" y="52" class="card-title">OLLVM 编译出 5 个版本</text>
    <text x="84" y="88" class="card-sub">同一份源码，每次只开一种混淆</text>
    <text x="84" y="112" class="card-sub">最后一版三种全开</text>
    <text x="440" y="40" class="section-label">编译产物</text>
    <g transform="translate(440, 62)">
      <rect x="0"   y="0" width="116" height="30" rx="15" fill="#1E293B" stroke="#94A3B8" stroke-width="1"/>
      <text x="58"  y="15" class="pill-txt" fill="#E2E8F0">无混淆（对照）</text>
      <rect x="126" y="0" width="116" height="30" rx="15" fill="#3B1D7A" stroke="#A78BFA" stroke-width="1"/>
      <text x="184" y="15" class="pill-txt" fill="#C4B5FD">BCF 伪造控制流</text>
      <rect x="252" y="0" width="116" height="30" rx="15" fill="#3B1D7A" stroke="#A78BFA" stroke-width="1"/>
      <text x="310" y="15" class="pill-txt" fill="#C4B5FD">IS 指令替换</text>
      <rect x="378" y="0" width="116" height="30" rx="15" fill="#3B1D7A" stroke="#A78BFA" stroke-width="1"/>
      <text x="436" y="15" class="pill-txt" fill="#C4B5FD">CFF 控制流平坦化</text>
      <rect x="504" y="0" width="116" height="30" rx="15" fill="#7F1D1D" stroke="#FB7185" stroke-width="1"/>
      <text x="562" y="15" class="pill-txt" fill="#FECDD3">组合（三者全开）</text>
    </g>
  </g>
  <line x1="600" y1="404" x2="600" y2="426" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow-flow)"/>

  <!-- Step 3 -->
  <g transform="translate(60, 432)">
    <rect x="0" y="0" width="1080" height="136" rx="12" fill="#2A1F08" stroke="#334155" stroke-width="1" filter="url(#softShadow)"/>
    <rect x="0" y="0" width="1080" height="5" rx="12" fill="#FBBF24"/>
    <rect x="0" y="3" width="1080" height="4" fill="#FBBF24"/>
    <circle cx="48" cy="52" r="22" fill="#FBBF24"/>
    <text x="48" y="52" class="step-num">3</text>
    <text x="84" y="52" class="card-title">Capstone 反汇编</text>
    <text x="84" y="88" class="card-sub">模型只能看到 x86_64 汇编</text>
    <text x="84" y="112" class="card-sub">看不到源码，也看不到伪代码</text>
    <rect x="440" y="24" width="620" height="92" rx="6" fill="#020617" stroke="#1E293B" stroke-width="1"/>
    <text x="456" y="44" class="code-comment">// 示意：模型拿到的输入长这样</text>
    <text x="456" y="68" class="code"><tspan class="code-keyword">mov</tspan> eax, edi<tspan x="660" class="code-keyword">and</tspan> eax, <tspan class="code-number">3</tspan></text>
    <text x="456" y="92" class="code"><tspan class="code-keyword">or</tspan> ecx, <tspan class="code-number">0xbaaad0bf</tspan><tspan x="660" class="code-keyword">imul</tspan> eax, ecx</text>
  </g>
  <line x1="600" y1="568" x2="600" y2="590" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow-flow)"/>

  <!-- Step 4 -->
  <g transform="translate(60, 596)">
    <rect x="0" y="0" width="1080" height="136" rx="12" fill="#2D1B3D" stroke="#334155" stroke-width="1" filter="url(#softShadow)"/>
    <rect x="0" y="0" width="1080" height="5" rx="12" fill="#D946EF"/>
    <rect x="0" y="3" width="1080" height="4" fill="#D946EF"/>
    <circle cx="48" cy="52" r="22" fill="#D946EF"/>
    <text x="48" y="52" class="step-num">4</text>
    <text x="84" y="52" class="card-title">交给 8 个 LLM 还原</text>
    <text x="84" y="88" class="card-sub">记录完整对话，必要时人工提示</text>
    <text x="84" y="112" class="card-sub">提示越多，说明模型越弱</text>
    <g transform="translate(440, 30)">
      <rect x="0"   y="0" width="149" height="30" rx="15" fill="#581C87" stroke="#D946EF" stroke-width="1"/>
      <text x="74"  y="15" class="pill-txt" fill="#F0ABFC">GPT-4o</text>
      <rect x="157" y="0" width="149" height="30" rx="15" fill="#581C87" stroke="#D946EF" stroke-width="1"/>
      <text x="231" y="15" class="pill-txt" fill="#F0ABFC">GPT-4.5</text>
      <rect x="314" y="0" width="149" height="30" rx="15" fill="#581C87" stroke="#D946EF" stroke-width="1"/>
      <text x="388" y="15" class="pill-txt" fill="#F0ABFC">GPT-Pro-o1</text>
      <rect x="471" y="0" width="149" height="30" rx="15" fill="#581C87" stroke="#D946EF" stroke-width="1"/>
      <text x="545" y="15" class="pill-txt" fill="#F0ABFC">GPT-3o Mini</text>
      <rect x="0"   y="42" width="149" height="30" rx="15" fill="#581C87" stroke="#D946EF" stroke-width="1"/>
      <text x="74"  y="57" class="pill-txt" fill="#F0ABFC">DeepSeek R1</text>
      <rect x="157" y="42" width="149" height="30" rx="15" fill="#581C87" stroke="#D946EF" stroke-width="1"/>
      <text x="231" y="57" class="pill-txt" fill="#F0ABFC">Grok 3</text>
      <rect x="314" y="42" width="149" height="30" rx="15" fill="#581C87" stroke="#D946EF" stroke-width="1"/>
      <text x="388" y="57" class="pill-txt" fill="#F0ABFC">Grok 2</text>
      <rect x="471" y="42" width="149" height="30" rx="15" fill="#581C87" stroke="#D946EF" stroke-width="1"/>
      <text x="545" y="57" class="pill-txt" fill="#F0ABFC">Claude 3.7 Sonnet</text>
    </g>
  </g>
  <line x1="600" y1="732" x2="600" y2="754" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow-flow)"/>

  <!-- Step 5 -->
  <g transform="translate(60, 760)">
    <rect x="0" y="0" width="1080" height="136" rx="12" fill="#0F2A1F" stroke="#334155" stroke-width="1" filter="url(#softShadow)"/>
    <rect x="0" y="0" width="1080" height="5" rx="12" fill="#34D399"/>
    <rect x="0" y="3" width="1080" height="4" fill="#34D399"/>
    <circle cx="48" cy="52" r="22" fill="#34D399"/>
    <text x="48" y="52" class="step-num">5</text>
    <text x="84" y="52" class="card-title">按"攻击者知识等级"打分</text>
    <text x="84" y="88" class="card-sub">分数 = 需要人帮多少忙</text>
    <text x="84" y="112" class="card-sub">越低越说明这种混淆挡不住模型</text>
    <g transform="translate(440, 28)">
      <rect x="0"   y="0" width="84" height="34" rx="6" fill="#052E1A" stroke="#34D399" stroke-width="1"/>
      <text x="42"  y="17" class="lvl-num" fill="#6EE7B7">0</text>
      <rect x="89"  y="0" width="84" height="34" rx="6" fill="#052E1A" stroke="#34D399" stroke-width="1"/>
      <text x="131" y="17" class="lvl-num" fill="#6EE7B7">1</text>
      <rect x="178" y="0" width="84" height="34" rx="6" fill="#713F12" stroke="#FBBF24" stroke-width="1"/>
      <text x="220" y="17" class="lvl-num" fill="#FDE68A">2</text>
      <rect x="267" y="0" width="84" height="34" rx="6" fill="#713F12" stroke="#FBBF24" stroke-width="1"/>
      <text x="309" y="17" class="lvl-num" fill="#FDE68A">3</text>
      <rect x="356" y="0" width="84" height="34" rx="6" fill="#7F1D1D" stroke="#FB7185" stroke-width="1"/>
      <text x="398" y="17" class="lvl-num" fill="#FECDD3">4</text>
      <rect x="445" y="0" width="84" height="34" rx="6" fill="#7F1D1D" stroke="#FB7185" stroke-width="1"/>
      <text x="487" y="17" class="lvl-num" fill="#FECDD3">5</text>
      <rect x="534" y="0" width="86" height="34" rx="6" fill="#1E293B" stroke="#94A3B8" stroke-width="1"/>
      <text x="577" y="17" class="lvl-num" fill="#E2E8F0">-</text>
      <text x="42"  y="56" class="lvl-txt">AI 自主完成</text>
      <text x="264" y="56" class="lvl-txt">需要越来越多提示</text>
      <text x="487" y="56" class="lvl-txt">专家重写</text>
      <text x="577" y="56" class="lvl-txt">无法分析</text>
      <line x1="140" y1="80" x2="430" y2="80" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#arrow-flow)"/>
      <text x="42"  y="80" class="lvl-txt" style="fill:#6EE7B7">混淆被攻破</text>
      <text x="487" y="80" class="lvl-txt" style="fill:#FECDD3">混淆仍有效</text>
    </g>
  </g>

  <text x="600" y="926" class="footer-text"><tspan fill="#38BDF8" font-weight="600">注意：</tspan>测试函数很短，汇编只有几百行；真实业务函数动辄上千行，结论需要打折看</text>
</svg>
