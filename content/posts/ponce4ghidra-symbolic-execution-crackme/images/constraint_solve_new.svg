<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 720" width="1200" height="720"
     font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A"/>
      <stop offset="100%" style="stop-color:#1E293B"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feOffset dx="0" dy="3" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow-flow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#34D399"/>
    </marker>
  </defs>
  <style>
    .title-main { font-size: 24px; fill: #F1F5F9; text-anchor: middle; dominant-baseline: central; font-weight: 700; }
    .title-accent { fill: #38BDF8; }
    .subtitle { font-size: 14px; fill: #CBD5E1; text-anchor: middle; dominant-baseline: central; }
    .card-title { font-size: 17px; fill: #F8FAFC; font-weight: 700; dominant-baseline: central; }
    .section-label { font-size: 12px; fill: #94A3B8; dominant-baseline: central; font-weight: 600; letter-spacing: 0.5px; }
    .code { font-family: 'SF Mono', 'Menlo', monospace; font-size: 13px; fill: #E2E8F0; dominant-baseline: central; }
    .code-keyword { fill: #F472B6; }
    .code-string { fill: #FCD34D; }
    .code-type { fill: #A5F3FC; }
    .code-number { fill: #FDBA74; }
    .code-out { fill: #86EFAC; }
    .code-comment { font-family: 'SF Mono', 'Menlo', monospace; font-size: 12px; fill: #64748B; dominant-baseline: central; font-style: italic; }
    .body-text { font-size: 13px; fill: #E2E8F0; dominant-baseline: central; }
    .pill-txt { font-size: 13px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
    .footer-text { font-size: 14px; fill: #CBD5E1; text-anchor: middle; dominant-baseline: central; }
    .footer-em { fill: #34D399; font-weight: 700; }
    .result-big { font-family: 'SF Mono', 'Menlo', monospace; font-size: 22px; fill: #F8FAFC; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
  </style>
  <rect width="1200" height="720" fill="url(#canvasBg)"/>

  <!-- Title -->
  <text x="600" y="36" class="title-main">Z3 约束求解过程<tspan class="title-accent"> · </tspan>从分支条件到具体密码</text>
  <text x="600" y="62" class="subtitle">check_password() 的 4 个 if 分支 = 4 条约束方程, Z3 在 0.03s 内全部求解</text>

  <!-- Column headers -->
  <text x="110" y="92" class="section-label">SOURCE CODE</text>
  <text x="560" y="92" class="section-label">CONSTRAINT</text>
  <text x="920" y="92" class="section-label">Z3 SOLVE</text>
  <text x="1100" y="92" class="section-label">RESULT</text>

  <!-- Horizontal separator -->
  <line x1="36" y1="104" x2="1164" y2="104" stroke="#334155" stroke-width="1"/>

  <!-- ====== Row 1: byte0 == 'P' (Cyan) ====== -->
  <g transform="translate(36, 114)">
    <rect x="0" y="0" width="1128" height="90" rx="12" fill="#0F1E2E" stroke="#334155" stroke-width="1" filter="url(#softShadow)"/>
    <rect x="0" y="0" width="1128" height="5" rx="12" fill="#38BDF8"/>
    <rect x="0" y="3" width="1128" height="4" fill="#38BDF8"/>

    <!-- byte index pill -->
    <rect x="16" y="28" width="46" height="24" rx="12" fill="#0C4A6E" stroke="#38BDF8" stroke-width="1"/>
    <text x="39" y="40" class="pill-txt" fill="#7DD3FC">[0]</text>

    <!-- source code -->
    <rect x="74" y="22" width="380" height="36" rx="6" fill="#020617" stroke="#1E3A5F" stroke-width="1"/>
    <text x="88" y="40" class="code"><tspan class="code-keyword">if</tspan> (input[<tspan class="code-number">0</tspan>] != <tspan class="code-string">'P'</tspan>) <tspan class="code-keyword">return</tspan> <tspan class="code-number">0</tspan>;</text>

    <!-- arrow -->
    <line x1="464" y1="40" x2="496" y2="40" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

    <!-- constraint -->
    <rect x="506" y="22" width="290" height="36" rx="6" fill="#020617" stroke="#1E3A5F" stroke-width="1"/>
    <text x="520" y="40" class="code"><tspan class="code-type">byte0</tspan> == <tspan class="code-number">0x50</tspan></text>

    <!-- arrow -->
    <line x1="806" y1="40" x2="838" y2="40" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

    <!-- solve -->
    <text x="856" y="40" class="body-text" style="fill:#7DD3FC">80</text>

    <!-- result pill -->
    <rect x="1040" y="24" width="70" height="32" rx="16" fill="#0C4A6E" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="1075" y="40" class="pill-txt" style="font-size:18px" fill="#F8FAFC">'P'</text>

    <!-- type label -->
    <text x="918" y="68" class="code-comment">direct compare</text>
  </g>

  <!-- Arrow between rows -->
  <line x1="600" y1="208" x2="600" y2="222" stroke="#64748B" stroke-width="1.2" marker-end="url(#arrow-flow)"/>

  <!-- ====== Row 2: byte1 == '4' (Cyan) ====== -->
  <g transform="translate(36, 226)">
    <rect x="0" y="0" width="1128" height="90" rx="12" fill="#0F1E2E" stroke="#334155" stroke-width="1" filter="url(#softShadow)"/>
    <rect x="0" y="0" width="1128" height="5" rx="12" fill="#38BDF8"/>
    <rect x="0" y="3" width="1128" height="4" fill="#38BDF8"/>

    <rect x="16" y="28" width="46" height="24" rx="12" fill="#0C4A6E" stroke="#38BDF8" stroke-width="1"/>
    <text x="39" y="40" class="pill-txt" fill="#7DD3FC">[1]</text>

    <rect x="74" y="22" width="380" height="36" rx="6" fill="#020617" stroke="#1E3A5F" stroke-width="1"/>
    <text x="88" y="40" class="code"><tspan class="code-keyword">if</tspan> (input[<tspan class="code-number">1</tspan>] != <tspan class="code-string">'4'</tspan>) <tspan class="code-keyword">return</tspan> <tspan class="code-number">0</tspan>;</text>

    <line x1="464" y1="40" x2="496" y2="40" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

    <rect x="506" y="22" width="290" height="36" rx="6" fill="#020617" stroke="#1E3A5F" stroke-width="1"/>
    <text x="520" y="40" class="code"><tspan class="code-type">byte1</tspan> == <tspan class="code-number">0x34</tspan></text>

    <line x1="806" y1="40" x2="838" y2="40" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

    <text x="856" y="40" class="body-text" style="fill:#7DD3FC">52</text>

    <rect x="1040" y="24" width="70" height="32" rx="16" fill="#0C4A6E" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="1075" y="40" class="pill-txt" style="font-size:18px" fill="#F8FAFC">'4'</text>

    <text x="918" y="68" class="code-comment">direct compare</text>
  </g>

  <line x1="600" y1="320" x2="600" y2="334" stroke="#64748B" stroke-width="1.2" marker-end="url(#arrow-flow)"/>

  <!-- ====== Row 3: byte2 XOR (Violet) ====== -->
  <g transform="translate(36, 338)">
    <rect x="0" y="0" width="1128" height="90" rx="12" fill="#2D1B3D" stroke="#334155" stroke-width="1" filter="url(#softShadow)"/>
    <rect x="0" y="0" width="1128" height="5" rx="12" fill="#A78BFA"/>
    <rect x="0" y="3" width="1128" height="4" fill="#A78BFA"/>

    <rect x="16" y="28" width="46" height="24" rx="12" fill="#3B1D7A" stroke="#A78BFA" stroke-width="1"/>
    <text x="39" y="40" class="pill-txt" fill="#C4B5FD">[2]</text>

    <rect x="74" y="22" width="380" height="36" rx="6" fill="#020617" stroke="#3B1D7A" stroke-width="1"/>
    <text x="88" y="40" class="code"><tspan class="code-keyword">if</tspan> ((input[<tspan class="code-number">2</tspan>] ^ <tspan class="code-number">0x42</tspan>) != <tspan class="code-number">0x10</tspan>) ...</text>

    <line x1="464" y1="40" x2="496" y2="40" stroke="#A78BFA" stroke-width="1.5" opacity="0.8"/>

    <rect x="506" y="22" width="290" height="36" rx="6" fill="#020617" stroke="#3B1D7A" stroke-width="1"/>
    <text x="520" y="40" class="code"><tspan class="code-type">byte2</tspan> ^ <tspan class="code-number">0x42</tspan> == <tspan class="code-number">0x10</tspan></text>

    <line x1="806" y1="40" x2="838" y2="40" stroke="#A78BFA" stroke-width="1.5" opacity="0.8"/>

    <text x="856" y="34" class="body-text" style="fill:#C4B5FD">0x52</text>
    <text x="856" y="52" class="body-text" style="fill:#C4B5FD">= 82</text>

    <rect x="1040" y="24" width="70" height="32" rx="16" fill="#3B1D7A" stroke="#A78BFA" stroke-width="1.5"/>
    <text x="1075" y="40" class="pill-txt" style="font-size:18px" fill="#F8FAFC">'R'</text>

    <text x="918" y="68" class="code-comment">XOR constraint</text>
  </g>

  <line x1="600" y1="432" x2="600" y2="446" stroke="#64748B" stroke-width="1.2" marker-end="url(#arrow-flow)"/>

  <!-- ====== Row 4: byte3 arithmetic (Amber) ====== -->
  <g transform="translate(36, 450)">
    <rect x="0" y="0" width="1128" height="90" rx="12" fill="#2A1F08" stroke="#334155" stroke-width="1" filter="url(#softShadow)"/>
    <rect x="0" y="0" width="1128" height="5" rx="12" fill="#FBBF24"/>
    <rect x="0" y="3" width="1128" height="4" fill="#FBBF24"/>

    <rect x="16" y="28" width="46" height="24" rx="12" fill="#713F12" stroke="#FBBF24" stroke-width="1"/>
    <text x="39" y="40" class="pill-txt" fill="#FDE68A">[3]</text>

    <rect x="74" y="22" width="380" height="36" rx="6" fill="#020617" stroke="#713F12" stroke-width="1"/>
    <text x="88" y="40" class="code"><tspan class="code-keyword">if</tspan> (input[<tspan class="code-number">3</tspan>] + <tspan class="code-number">0x20</tspan> != <tspan class="code-number">0x87</tspan>) ...</text>

    <line x1="464" y1="40" x2="496" y2="40" stroke="#FBBF24" stroke-width="1.5" opacity="0.8"/>

    <rect x="506" y="22" width="290" height="36" rx="6" fill="#020617" stroke="#713F12" stroke-width="1"/>
    <text x="520" y="40" class="code"><tspan class="code-type">byte3</tspan> + <tspan class="code-number">0x20</tspan> == <tspan class="code-number">0x87</tspan></text>

    <line x1="806" y1="40" x2="838" y2="40" stroke="#FBBF24" stroke-width="1.5" opacity="0.8"/>

    <text x="856" y="34" class="body-text" style="fill:#FDE68A">0x67</text>
    <text x="856" y="52" class="body-text" style="fill:#FDE68A">= 103</text>

    <rect x="1040" y="24" width="70" height="32" rx="16" fill="#713F12" stroke="#FBBF24" stroke-width="1.5"/>
    <text x="1075" y="40" class="pill-txt" style="font-size:18px" fill="#F8FAFC">'g'</text>

    <text x="918" y="68" class="code-comment">arithmetic constraint</text>
  </g>

  <!-- Arrow to result -->
  <line x1="600" y1="544" x2="600" y2="574" stroke="#34D399" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- ====== Combined Result (Emerald) ====== -->
  <g transform="translate(260, 580)">
    <rect x="0" y="0" width="680" height="70" rx="14" fill="#0F2A1F" stroke="#34D399" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="0" y="0" width="680" height="6" rx="14" fill="#34D399"/>
    <rect x="0" y="4" width="680" height="4" fill="#34D399"/>

    <text x="340" y="28" class="section-label" style="text-anchor:middle; fill:#6EE7B7; letter-spacing:2px">COMBINED SOLUTION</text>

    <text x="165" y="52" class="code" style="font-size:16px"><tspan class="code-number">0x50345267</tspan></text>

    <text x="330" y="52" class="body-text" style="fill:#6EE7B7; font-size:16px">=</text>

    <rect x="360" y="36" width="120" height="32" rx="16" fill="#052E1A" stroke="#34D399" stroke-width="1.5"/>
    <text x="420" y="52" class="result-big" style="font-size:18px; fill:#6EE7B7">P4Rg</text>

    <text x="530" y="52" class="code-comment" style="font-size:13px">0.03 seconds</text>
  </g>

  <!-- Footer -->
  <text x="600" y="690" class="footer-text"><tspan class="footer-em">4 bytes = 2^32 = 4,294,967,296</tspan> possibilities, reduced to <tspan class="footer-em">4 equations</tspan> solved in milliseconds</text>
</svg>
