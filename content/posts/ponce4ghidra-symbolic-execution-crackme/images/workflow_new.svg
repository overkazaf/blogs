<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 960" width="1200" height="960"
     font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A"/>
      <stop offset="100%" style="stop-color:#1E293B"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feOffset dx="0" dy="3" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow-flow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
  </defs>
  <style>
    .title-main { font-size: 24px; fill: #F1F5F9; text-anchor: middle; dominant-baseline: central; font-weight: 700; }
    .title-accent { fill: #38BDF8; }
    .subtitle { font-size: 14px; fill: #CBD5E1; text-anchor: middle; dominant-baseline: central; }
    .root-title { font-size: 18px; fill: #F8FAFC; text-anchor: middle; dominant-baseline: central; font-weight: 700; }
    .root-desc { font-size: 13px; fill: #CBD5E1; text-anchor: middle; dominant-baseline: central; }
    .step-num { font-family: 'SF Mono', 'Menlo', monospace; font-size: 28px; font-weight: 800; fill: #0F172A; text-anchor: middle; dominant-baseline: central; }
    .step-title { font-size: 20px; fill: #F8FAFC; font-weight: 700; dominant-baseline: central; }
    .step-tag { font-size: 13px; fill: #CBD5E1; dominant-baseline: central; }
    .step-desc { font-size: 13px; fill: #E2E8F0; dominant-baseline: central; }
    .section-label { font-size: 12px; fill: #94A3B8; dominant-baseline: central; font-weight: 600; letter-spacing: 0.5px; }
    .code { font-family: 'SF Mono', 'Menlo', monospace; font-size: 13px; fill: #E2E8F0; dominant-baseline: central; }
    .code-comment { font-family: 'SF Mono', 'Menlo', monospace; font-size: 12px; fill: #64748B; dominant-baseline: central; font-style: italic; }
    .code-keyword { fill: #F472B6; }
    .code-string { fill: #FCD34D; }
    .code-type { fill: #A5F3FC; }
    .code-number { fill: #FDBA74; }
    .code-out { fill: #86EFAC; }
    .limit-text { font-size: 12px; fill: #CBD5E1; dominant-baseline: central; }
    .limit-em-cyan { fill: #38BDF8; font-weight: 600; }
    .limit-em-violet { fill: #A78BFA; font-weight: 600; }
    .limit-em-rose { fill: #FB7185; font-weight: 600; }
    .limit-em-green { fill: #34D399; font-weight: 600; }
    .footer-text { font-size: 14px; fill: #CBD5E1; text-anchor: middle; dominant-baseline: central; }
    .footer-em { fill: #38BDF8; font-weight: 600; }
  </style>
  <rect width="1200" height="960" fill="url(#canvasBg)"/>

  <!-- Title -->
  <text x="600" y="42" class="title-main">Ponce4Ghidra<tspan class="title-accent"> · </tspan>符号执行工作流</text>
  <text x="600" y="72" class="subtitle">从未知输入到具体密码 - 4 步自动求解</text>

  <!-- Root node -->
  <g transform="translate(350, 100)">
    <rect x="0" y="0" width="500" height="66" rx="10" fill="#0F1E2E" stroke="#38BDF8" stroke-width="1.5" filter="url(#softShadow)"/>
    <rect x="0" y="0" width="4" height="66" rx="2" fill="#38BDF8"/>
    <text x="250" y="25" class="root-title">./test_crackme &lt;password&gt;</text>
    <text x="250" y="48" class="root-desc">4 bytes unknown - 2^32 = 4,294,967,296 possibilities</text>
  </g>

  <!-- arrow root to step 1 -->
  <line x1="600" y1="166" x2="600" y2="198" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-flow)"/>

  <!-- Step 1: Symbolize (Cyan) -->
  <g transform="translate(36, 202)">
    <rect x="0" y="0" width="1128" height="160" rx="12" fill="#0F1E2E" stroke="#334155" stroke-width="1" filter="url(#softShadow)"/>
    <rect x="0" y="0" width="1128" height="5" rx="12" fill="#38BDF8"/>
    <rect x="0" y="3" width="1128" height="4" fill="#38BDF8"/>

    <circle cx="56" cy="60" r="30" fill="#38BDF8" filter="url(#softShadow)"/>
    <text x="56" y="60" class="step-num">1</text>

    <text x="102" y="40" class="step-title">Symbolize</text>
    <text x="220" y="42" class="step-tag">- 符号化输入</text>
    <rect x="102" y="56" width="72" height="22" rx="11" fill="#0C4A6E" stroke="#38BDF8" stroke-width="1"/>
    <text x="138" y="68" class="step-tag" style="font-weight:700; text-anchor:middle; fill:#7DD3FC; font-size:11px">起始点</text>
    <text x="184" y="67" class="step-tag" style="fill:#94A3B8">用数学未知量替代具体输入值</text>

    <!-- code block -->
    <rect x="102" y="88" width="1010" height="36" rx="6" fill="#020617" stroke="#1E3A5F" stroke-width="1"/>
    <text x="116" y="106" class="code">sym_var = <tspan class="code-type">claripy</tspan>.<tspan class="code-keyword">BVS</tspan>(<tspan class="code-string">"argv1"</tspan>, <tspan class="code-number">32</tspan>)   <tspan class="code-comment">// 4 bytes = 32 bits of unknown</tspan>    <tspan class="code-out">input = [?, ?, ?, ?]</tspan></text>

    <text x="102" y="140" class="limit-text"><tspan class="limit-em-cyan">原理：</tspan>input[0] 不再是 0x41，而是一个 8-bit 符号变量 byte0，取值范围 [0, 255]</text>
  </g>

  <!-- arrow step 1 to step 2 -->
  <line x1="600" y1="368" x2="600" y2="400" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-flow)"/>

  <!-- Step 2: Fork (Violet) -->
  <g transform="translate(36, 404)">
    <rect x="0" y="0" width="1128" height="160" rx="12" fill="#2D1B3D" stroke="#334155" stroke-width="1" filter="url(#softShadow)"/>
    <rect x="0" y="0" width="1128" height="5" rx="12" fill="#A78BFA"/>
    <rect x="0" y="3" width="1128" height="4" fill="#A78BFA"/>

    <circle cx="56" cy="60" r="30" fill="#A78BFA" filter="url(#softShadow)"/>
    <text x="56" y="60" class="step-num">2</text>

    <text x="102" y="40" class="step-title">Fork</text>
    <text x="158" y="42" class="step-tag">- 路径分叉</text>
    <rect x="102" y="56" width="100" height="22" rx="11" fill="#3B1D7A" stroke="#A78BFA" stroke-width="1"/>
    <text x="152" y="68" class="step-tag" style="font-weight:700; text-anchor:middle; fill:#C4B5FD; font-size:11px">指数级分裂</text>
    <text x="214" y="67" class="step-tag" style="fill:#94A3B8">每个 if 分支产生两条独立路径</text>

    <!-- branching visual: two code blocks side by side -->
    <rect x="102" y="88" width="490" height="36" rx="6" fill="#020617" stroke="#1E3A5F" stroke-width="1"/>
    <text x="116" y="106" class="code"><tspan class="code-keyword">if</tspan> (input[<tspan class="code-number">0</tspan>] == <tspan class="code-string">'P'</tspan>)  <tspan class="code-out">Path A: byte0 == 0x50</tspan></text>

    <rect x="622" y="88" width="490" height="36" rx="6" fill="#020617" stroke="#1E3A5F" stroke-width="1"/>
    <text x="636" y="106" class="code"><tspan class="code-keyword">else</tspan>                  <tspan style="fill:#FB7185">Path B: byte0 != 0x50</tspan>  <tspan class="code-comment">// avoid</tspan></text>

    <text x="102" y="140" class="limit-text"><tspan class="limit-em-violet">关键：</tspan>4 个 if 分支 = 2^4 = 16 条路径，angr 同时探索所有路径，Find 路径胜出</text>
  </g>

  <!-- arrow step 2 to step 3 -->
  <line x1="600" y1="570" x2="600" y2="602" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-flow)"/>

  <!-- Step 3: Collect (Rose) -->
  <g transform="translate(36, 606)">
    <rect x="0" y="0" width="1128" height="160" rx="12" fill="#2E1421" stroke="#334155" stroke-width="1" filter="url(#softShadow)"/>
    <rect x="0" y="0" width="1128" height="5" rx="12" fill="#FB7185"/>
    <rect x="0" y="3" width="1128" height="4" fill="#FB7185"/>

    <circle cx="56" cy="60" r="30" fill="#FB7185" filter="url(#softShadow)"/>
    <text x="56" y="60" class="step-num">3</text>

    <text x="102" y="40" class="step-title">Collect</text>
    <text x="190" y="42" class="step-tag">- 约束收集</text>
    <rect x="102" y="56" width="88" height="22" rx="11" fill="#7F1D1D" stroke="#FB7185" stroke-width="1"/>
    <text x="146" y="68" class="step-tag" style="font-weight:700; text-anchor:middle; fill:#FECDD3; font-size:11px">自动积累</text>
    <text x="202" y="67" class="step-tag" style="fill:#94A3B8">到达 Find 目标的路径收集了全部约束</text>

    <!-- constraint list as code -->
    <rect x="102" y="88" width="1010" height="36" rx="6" fill="#020617" stroke="#1E3A5F" stroke-width="1"/>
    <text x="116" y="106" class="code"><tspan style="fill:#FECDD3">byte0</tspan>==<tspan class="code-number">80</tspan>  <tspan fill="#475569">AND</tspan>  <tspan style="fill:#FECDD3">byte1</tspan>==<tspan class="code-number">52</tspan>  <tspan fill="#475569">AND</tspan>  <tspan style="fill:#FECDD3">byte2</tspan>^<tspan class="code-number">0x42</tspan>==<tspan class="code-number">0x10</tspan>  <tspan fill="#475569">AND</tspan>  <tspan style="fill:#FECDD3">byte3</tspan>+<tspan class="code-number">0x20</tspan>==<tspan class="code-number">0x87</tspan></text>

    <text x="102" y="140" class="limit-text"><tspan class="limit-em-rose">本质：</tspan>4.3 billion possibilities reduced to 4 equations - each branch eliminates half the search space</text>
  </g>

  <!-- arrow step 3 to step 4 -->
  <line x1="600" y1="772" x2="600" y2="804" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-flow)"/>

  <!-- Step 4: Solve (Emerald) -->
  <g transform="translate(36, 808)">
    <rect x="0" y="0" width="1128" height="110" rx="12" fill="#0F2A1F" stroke="#334155" stroke-width="1" filter="url(#softShadow)"/>
    <rect x="0" y="0" width="1128" height="5" rx="12" fill="#34D399"/>
    <rect x="0" y="3" width="1128" height="4" fill="#34D399"/>

    <circle cx="56" cy="52" r="30" fill="#34D399" filter="url(#softShadow)"/>
    <text x="56" y="52" class="step-num">4</text>

    <text x="102" y="36" class="step-title">Solve</text>
    <text x="168" y="38" class="step-tag">- Z3 SMT Solver</text>
    <rect x="102" y="52" width="88" height="22" rx="11" fill="#052E1A" stroke="#34D399" stroke-width="1"/>
    <text x="146" y="64" class="step-tag" style="font-weight:700; text-anchor:middle; fill:#6EE7B7; font-size:11px">秒级输出</text>
    <text x="200" y="63" class="step-tag" style="fill:#94A3B8">CDCL engine solves in milliseconds</text>

    <!-- result -->
    <rect x="102" y="82" width="1010" height="20" rx="6" fill="transparent"/>
    <text x="116" y="92" class="code"><tspan class="code-type">solver</tspan>.<tspan class="code-keyword">eval</tspan>(sym_var)  <tspan class="code-out">--> 0x50345267 --> b'P4Rg'</tspan>    <tspan class="code-comment">// 0.03 seconds</tspan></text>
  </g>

  <!-- Bottom takeaway -->
  <text x="600" y="942" class="footer-text"><tspan class="footer-em">Not brute force:</tspan> 2^128 possibilities for 16-byte input, but constraints reduce it to a system Z3 solves in seconds</text>
</svg>
